name: Stage npm package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run release:check
      - name: 暂存尚未公开的版本
        run: |
          package=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$package" version; then
            echo "版本已公开，发行验收完成，无需重复暂存。"
          else
            npm stage publish
          fi
