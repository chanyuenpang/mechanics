<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mechanics 局部图</title><style>
:root{--positive:#328577;--negative:#bd7064;--random:#8b6fb3;--specializes:#c49a26;color-scheme:light dark;font:13px system-ui,sans-serif}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#fafbf8}#canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;background-color:#fafbf8;background-image:radial-gradient(#dce3d6 .8px,transparent .8px);background-size:22px 22px;user-select:none;-webkit-user-select:none}#canvas *{user-select:none;-webkit-user-select:none}#canvas.panning{cursor:grabbing}.node{cursor:grab;outline:none}.node rect{fill:#fff;stroke:#dce3d7;stroke-width:1;filter:drop-shadow(0 2px 2px #243c2410)}.node text{fill:#364333;font-size:13px;font-weight:500;pointer-events:none}.node text.node-meta{fill:#a0ab9a;font-size:9px;font-weight:400}.node text.node-badge{fill:#62765e;font-size:8px;font-weight:400}.node circle{fill:#fdfefc;stroke:#b3c3ac;stroke-width:1.4}.edge-line{fill:none;stroke-width:1.8}.edge-hit{fill:none;stroke:transparent;stroke-width:15}.edge-label{font-size:12px;font-weight:600;pointer-events:none}.edge-positive{stroke:var(--positive)}.edge-negative{stroke:var(--negative)}.edge-random{stroke:var(--random)}.edge-specializes{stroke:var(--specializes)}.edge-empty-rule{stroke:#9a9fa6}.edge-label.positive{fill:var(--positive)}.edge-label.negative{fill:var(--negative)}.edge-label.random{fill:var(--random)}.edge-label.specializes{fill:var(--specializes)}.edge-label.empty-rule{fill:#9a9fa6}#canvas-tooltip{position:fixed;z-index:10;max-width:min(660px,calc(100% - 28px));padding:10px 12px;border:1px solid #111;border-radius:8px;background:#000c;box-shadow:0 8px 24px #11111140;color:#c9ccc8;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}#error{position:fixed;inset:16px;padding:12px;border-radius:8px;background:#fff0ef;color:#9b2d25;white-space:pre-wrap}@media(prefers-color-scheme:dark){html,body,#canvas{background-color:#1e271e;background-image:radial-gradient(#394839 .8px,transparent .8px)}.node rect{fill:#29372a;stroke:#718b72}.node text{fill:#e5eee2}.node text.node-meta{fill:#a6b7a5}}
</style></head><body><svg id="canvas" aria-label="Mechanics 概念局部图" tabindex="0"></svg><div id="canvas-tooltip" role="tooltip" hidden></div><div id="error" role="alert" hidden></div><script>/* MCP_WIDGET_BUNDLE */</script></body></html>
