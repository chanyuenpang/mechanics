<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>规则图 · 游戏规则分析工具</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="startup-help" role="status">请通过 CLI 启动编辑器，再打开终端打印的完整 http://127.0.0.1 网址。直接双击 index.html 无法加载模块或读写工作区。<code>game-rule-analyzer serve --workspace &lt;资料目录&gt;</code></div>
  <aside id="sidebar">
    <div class="brand"><span class="brand-mark">⌘</span><strong>规则图</strong><span class="badge">本地</span></div>
    <div class="workspace-heading"><span id="workspace-name">正在读取工作区…</span></div>
    <div id="workspace-root" class="workspace-root"></div>
    <button id="new-graph" class="new-analysis" aria-label="新建分析图">＋ 新建分析图</button>
    <div class="section-label"><span>分析文件</span></div>
    <nav id="files" aria-label="分析文件目录"></nav>
    <p class="layer-help">勾选以叠加 · 点击以编辑<br>当前选择自动记忆</p>
    <div class="sidebar-footer"><span class="status-dot"></span><span>JSON 文件保存在项目内</span><button id="reload" class="icon-button" title="重新读取磁盘文件" aria-label="重新读取磁盘文件">↻</button></div>
  </aside>
  <main id="main">
    <header class="topbar">
      <button id="toggle-sidebar" class="icon-button" title="切换文件侧栏" aria-label="切换文件侧栏">☰</button>
      <div id="main-views" class="view-switch" role="group" aria-label="工作视图"><button id="table-view">概念表</button><button id="graph-view">分析图</button></div>
      <div class="breadcrumb"><span id="file-kind">工作区</span><span class="slash">/</span><strong id="file-name">加载中</strong><span id="dirty-dot" hidden>●</span></div>
      <div class="header-actions"><span id="save-state">本地文件</span><button id="export" class="quiet" title="导出当前文件或未保存草稿">导出 JSON</button><button id="save" class="primary" disabled>保存 <kbd>Ctrl S</kbd></button></div>
    </header>
    <div id="error" role="alert" hidden><span id="error-text"></span><button id="reload-error" hidden>重新读取</button><button id="dismiss-error" class="icon-button" aria-label="关闭错误提示">×</button></div>
    <section id="glossary" aria-label="节点定义表格" hidden></section>
    <section id="stage" aria-label="节点画布区域">
      <svg id="canvas" aria-label="规则节点画布" tabindex="0"></svg>
      <div id="empty" hidden><span class="empty-symbol">＋</span><h2 id="empty-title">开始一张分析图</h2><p id="empty-hint">引用概念，将抽象规则连接起来。</p><button id="empty-add">引用概念</button></div>
      <div id="canvas-context"><span id="scope-chip"></span><span id="overlay-count"></span></div>
      <div id="toolbar" class="floating" role="toolbar" aria-label="画布工具">
        <button id="select-tool" class="tool active" title="选择与拖拽 V" aria-label="选择工具">↖</button>
        <span class="divider"></span><button id="add-node" class="tool text-tool">＋ <span>引用概念</span></button>
        <span class="divider"></span><button id="positive-tool" class="tool positive" title="先点源节点，再点目标节点" aria-label="促进连线">＋→</button>
        <button id="negative-tool" class="tool negative" title="先点源节点，再点目标节点" aria-label="抑制连线">−→</button>
        <span class="divider"></span><button id="undo" class="tool" title="撤销 Ctrl Z" aria-label="撤销" disabled>↶</button><button id="redo" class="tool" title="重做 Ctrl Shift Z" aria-label="重做" disabled>↷</button>
      </div>
      <div id="tool-hint" aria-live="polite">拖拽节点 · 滚轮缩放 · 空格拖拽画布</div>
      <div class="bottom-left"><button id="diagnostics" class="floating small-button">◉ 结构提示</button><button id="unfold" class="floating small-button" hidden>展开节点</button><span id="counts"></span></div>
      <div class="zoom floating"><button id="zoom-out" class="icon-button" aria-label="缩小">−</button><span id="zoom">100%</span><button id="zoom-in" class="icon-button" aria-label="放大">＋</button><span class="divider"></span><button id="fit" class="icon-button" title="适应画布 F" aria-label="适应画布">⛶</button></div>
      <div id="legend"><span class="positive">＋ 促进</span><span class="negative">− 抑制</span><span>浅色关系为其他图层</span></div>
    </section>
    <aside id="inspector" class="floating" hidden><div class="panel-header"><strong id="inspector-title">属性</strong><button id="close-inspector" class="icon-button" aria-label="关闭属性">×</button></div><div id="properties"></div></aside>
  </main>
  <dialog id="dialog"><form id="dialog-form"><div class="panel-header"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" type="button" aria-label="关闭对话框">×</button></div><div id="dialog-content"></div><div id="dialog-error" role="alert" hidden></div><div class="dialog-actions"><button id="cancel-dialog" type="button">取消</button><button id="confirm-dialog" type="submit" class="primary">确定</button></div></form></dialog>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
